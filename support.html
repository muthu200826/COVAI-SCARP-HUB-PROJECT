<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#149447">
<title>COVAI SCRAP HUB | Customer Support</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#149447;
    --green-dark:#087536;
    --green-light:#eaf8ef;
    --bg:#f5f8f6;
    --card:#ffffff;
    --text:#15231b;
    --muted:#718078;
    --border:#e0e9e3;
    --input:#ffffff;
    --shadow:0 8px 30px rgba(20,70,40,.07);
}

body.dark-mode{
    --green:#34d399;
    --green-dark:#10b981;
    --green-light:#172b22;
    --bg:#0b1110;
    --card:#141c19;
    --text:#f1f5f3;
    --muted:#9aa8a1;
    --border:#293732;
    --input:#18211e;
    --shadow:0 8px 30px rgba(0,0,0,.25);
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:"DM Sans",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:.25s ease;
}

/* ================= HEADER ================= */

.topbar{
    height:68px;
    min-height:68px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    z-index:10;
    box-shadow:0 2px 12px rgba(20,50,30,.05);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    color:var(--text);
    text-decoration:none;
    min-width:0;
}

.brand-logo{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--green);
    background:#fff;
    flex-shrink:0;
}

.brand-info{
    min-width:0;
}

.brand-title{
    font-family:"Manrope",sans-serif;
    font-size:17px;
    font-weight:800;
    line-height:1.1;
}

.brand-title span{
    color:var(--green);
}

.online{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
}

.online-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 0 3px rgba(34,197,94,.12);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.header-btn,
.lang-toggle{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
}

.header-btn{
    width:39px;
    height:39px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.lang-toggle{
    padding:9px 12px;
    border-radius:11px;
    font-size:11px;
    font-weight:700;
}

.header-btn:hover,
.lang-toggle:hover{
    background:var(--green-light);
    border-color:var(--green);
    color:var(--green);
}

/* ================= CHAT ================= */

.chat-container{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
}

.chat-container::-webkit-scrollbar{
    width:6px;
}

.chat-container::-webkit-scrollbar-thumb{
    background:#b7c8bd;
    border-radius:20px;
}

.chat-content{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:24px 20px 30px;
}

/* ================= WELCOME CARD ================= */

.welcome-card{
    background:linear-gradient(135deg,var(--green-light),var(--card));
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
}

.welcome-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.welcome-icon{
    width:48px;
    height:48px;
    border-radius:15px;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-shrink:0;
}

.welcome-card h1{
    font-family:"Manrope",sans-serif;
    font-size:18px;
    font-weight:800;
}

.welcome-card p{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

/* ================= MESSAGE ================= */

.message{
    display:flex;
    margin-bottom:17px;
    animation:messageIn .28s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.message-inner{
    display:flex;
    align-items:flex-end;
    gap:9px;
    max-width:88%;
}

.user .message-inner{
    flex-direction:row-reverse;
}

.message-avatar{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    flex-shrink:0;
}

.bot .message-avatar{
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;
}

.user .message-avatar{
    background:#e7ece9;
    color:#53615a;
}

body.dark-mode .user .message-avatar{
    background:#24312c;
    color:#d5ddd8;
}

.bubble{
    max-width:100%;
    padding:12px 15px;
    border-radius:17px;
    font-size:14px;
    line-height:1.58;
    overflow-wrap:anywhere;
}

.bot .bubble{
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:0 3px 12px rgba(20,50,30,.045);
    border-bottom-left-radius:5px;
}

.user .bubble{
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;
    border-bottom-right-radius:5px;
}

.bubble strong{
    font-weight:700;
}

.bubble a{
    color:var(--green);
    text-decoration:none;
    font-weight:700;
}

.user .bubble a{
    color:#fff;
}

.bubble a:hover{
    text-decoration:underline;
}

/* ================= TIME ================= */

.message-time{
    font-size:9px;
    color:var(--muted);
    margin-top:4px;
    padding:0 3px;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    align-items:center;
    gap:4px;
    padding:13px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    border-bottom-left-radius:5px;
}

.typing span{
    width:6px;
    height:6px;
    background:#8b9992;
    border-radius:50%;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* ================= QUICK ACTIONS ================= */

.quick-section{
    margin:8px 0 22px 41px;
}

.quick-title{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:9px;
}

.quick-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.quick-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:9px 12px;
    border-radius:22px;
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 6px rgba(20,50,30,.03);
}

.quick-btn:hover{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
    transform:translateY(-1px);
}

/* ================= ACTION CARDS ================= */

.action-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:12px;
}

.action-card{
    border:1px solid var(--border);
    background:var(--card);
    border-radius:13px;
    padding:11px;
    cursor:pointer;
    transition:.2s;
    color:var(--text);
    text-align:left;
}

.action-card:hover{
    border-color:var(--green);
    transform:translateY(-1px);
}

.action-card-icon{
    font-size:18px;
    margin-bottom:4px;
}

.action-card-title{
    font-size:11px;
    font-weight:700;
}

.action-card-text{
    font-size:9px;
    color:var(--muted);
    margin-top:2px;
}

/* ================= INPUT ================= */

.input-area{
    background:var(--card);
    border-top:1px solid var(--border);
    padding:13px 20px calc(13px + env(safe-area-inset-bottom));
    flex-shrink:0;
}

.input-wrapper{
    width:100%;
    max-width:850px;
    margin:auto;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:16px;
    padding:7px;
    transition:.2s;
}

.input-box:focus-within{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(20,148,71,.08);
}

.question-input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    line-height:1.5;
    min-height:42px;
    max-height:120px;
    padding:10px 9px;
    resize:none;
}

.question-input::placeholder{
    color:#9aa59f;
}

.send-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.send-btn:hover:not(:disabled){
    transform:scale(1.04);
}

.send-btn:disabled{
    background:#c9d1cc;
    cursor:not-allowed;
}

.input-note{
    text-align:center;
    font-size:9px;
    color:var(--muted);
    margin-top:7px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .topbar{
        height:60px;
        min-height:60px;
        padding:0 10px;
    }

    .brand-logo{
        width:36px;
        height:36px;
    }

    .brand-title{
        font-size:14px;
    }

    .online{
        font-size:8px;
    }

    .header-actions{
        gap:5px;
    }

    .header-btn{
        width:34px;
        height:34px;
        font-size:15px;
        border-radius:9px;
    }

    .lang-toggle{
        padding:8px 9px;
        font-size:9px;
        border-radius:9px;
    }

    .chat-content{
        padding:16px 10px 24px;
    }

    .welcome-card{
        padding:14px;
        border-radius:17px;
        margin-bottom:17px;
    }

    .welcome-icon{
        width:42px;
        height:42px;
        border-radius:13px;
        font-size:21px;
    }

    .welcome-card h1{
        font-size:15px;
    }

    .welcome-card p{
        font-size:11px;
    }

    .message{
        margin-bottom:14px;
    }

    .message-inner{
        max-width:94%;
        gap:7px;
    }

    .message-avatar{
        width:28px;
        height:28px;
        min-width:28px;
        font-size:13px;
    }

    .bubble{
        padding:10px 12px;
        font-size:12.5px;
        line-height:1.55;
        border-radius:15px;
    }

    .quick-section{
        margin-left:35px;
    }

    .quick-actions{
        gap:6px;
    }

    .quick-btn{
        padding:8px 10px;
        font-size:10px;
    }

    .action-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .input-area{
        padding:9px 9px calc(9px + env(safe-area-inset-bottom));
    }

    .input-box{
        border-radius:14px;
        padding:6px;
    }

    .question-input{
        font-size:13px;
        min-height:40px;
        padding:9px 7px;
    }

    .send-btn{
        width:39px;
        height:39px;
        min-width:39px;
        border-radius:10px;
        font-size:16px;
    }

    .input-note{
        font-size:8px;
    }
}

@media(max-width:360px){

    .brand-title{
        font-size:13px;
    }

    .brand-logo{
        width:33px;
        height:33px;
    }

    .lang-toggle{
        padding:7px 8px;
    }

    .message-inner{
        max-width:96%;
    }

    .quick-btn{
        font-size:9px;
        padding:7px 9px;
    }
}
</style>
</head>

    },

    copper:{
        en:`🔶 <strong>Copper scrap</strong> such as wires, cables, pipes and other copper materials may be collected.<br><br>
        For the latest copper price, check the current rates shown on the website.`,
        ta:`🔶 wires, cables, pipes போன்ற <strong>செம்பு scrap</strong> பொருட்கள் சேகரிக்கப்படலாம்.<br><br>
        சமீபத்திய செம்பு விலைக்கு website-ல் current rates பார்க்கவும்.`
    },

    aluminium:{
        en:`🥫 <strong>Aluminium scrap</strong> such as utensils, frames, sheets and similar materials may be collected.<br><br>
        Please check the latest rate before booking.`,
        ta:`🥫 பாத்திரங்கள், frames, sheets போன்ற <strong>அலுமினியம் scrap</strong> பொருட்கள் சேகரிக்கப்படலாம்.<br><br>
        Booking செய்வதற்கு முன் latest rate பார்க்கவும்.`
    },

    brass:{
        en:`🟡 <strong>Brass scrap</strong> may include brass fittings, parts, utensils and other recyclable brass materials.<br><br>
        Check the current rate on the website.`,
        ta:`🟡 fittings, parts, பாத்திரங்கள் போன்ற <strong>பித்தளை scrap</strong> பொருட்கள் சேகரிக்கப்படலாம்.<br><br>
        Website-ல் current rate பார்க்கவும்.`
    },

    plastic:{
        en:`📦 Recyclable <strong>plastic</strong> materials such as bottles, containers and similar scrap may be collected.<br><br>
        Sorting plastic by type can help make collection easier.`,
        ta:`📦 bottles, containers போன்ற மறுசுழற்சி செய்யக்கூடிய <strong>plastic</strong> பொருட்கள் சேகரிக்கப்படலாம்.<br><br>
        Plastic-ஐ வகைப்படுத்தி வைத்தால் collection எளிதாக இருக்கும்.`
    },

    battery:{
        en:`🔋 Used batteries can require proper handling and recycling.<br><br>
        If you have battery scrap, mention the type and quantity while booking or contact our support team.`,
        ta:`🔋 பயன்படுத்திய batteries-க்கு சரியான handling மற்றும் recycling தேவைப்படலாம்.<br><br>
        Battery scrap இருந்தால் அதன் type மற்றும் quantity-ஐ booking-ல் குறிப்பிடவும் அல்லது support-ஐ தொடர்பு கொள்ளவும்.`
    },

    ewaste:{
        en:`💻 <strong>E-waste</strong> may include old computers, laptops, monitors, printers, phones, cables and other electronic scrap.<br><br>
        Remove personal data from devices before handing them over.`,
        ta:`💻 <strong>E-waste</strong> என்பதில் பழைய computers, laptops, monitors, printers, phones, cables போன்ற electronic scrap அடங்கலாம்.<br><br>
        Device கொடுப்பதற்கு முன் உங்கள் personal data-வை நீக்குங்கள்.`
    },

    laptop:{
        en:`💻 Old laptops may be considered e-waste.<br><br>
        Before selling a laptop, back up important files and remove personal accounts/data.`,
        ta:`💻 பழைய laptops e-waste ஆக இருக்கலாம்.<br><br>
        Laptop விற்கும் முன் முக்கியமான files-ஐ backup செய்து personal accounts/data-வை remove செய்யுங்கள்.`
    },

    computer:{
        en:`🖥️ Old computers and computer components may be collected as e-waste depending on the item.<br><br>
        Remove personal data before collection.`,
        ta:`🖥️ பழைய computers மற்றும் computer components e-waste ஆக சேகரிக்கப்படலாம்.<br><br>
        Collection-க்கு முன் personal data-வை நீக்குங்கள்.`
    },

    mobile:{
        en:`📱 Old mobile phones may be handled as e-waste.<br><br>
        Back up your information and factory-reset the device before handing it over.`,
        ta:`📱 பழைய mobile phones e-waste ஆக இருக்கலாம்.<br><br>
        உங்கள் தகவல்களை backup செய்து device-ஐ factory reset செய்யுங்கள்.`
    },

    tv:{
        en:`📺 Old TVs and monitors may be treated as e-waste.<br><br>
        For large electronic items, mention the item during booking.`,
        ta:`📺 பழைய TV மற்றும் monitors e-waste ஆக இருக்கலாம்.<br><br>
        பெரிய electronic items இருந்தால் booking செய்யும்போது குறிப்பிடவும்.`
    },

    refrigerator:{
        en:`❄️ Old refrigerators are large electronic appliances. Mention the appliance clearly while requesting pickup so the team knows what is being collected.`,
        ta:`❄️ பழைய refrigerator ஒரு பெரிய electronic appliance. Pickup request செய்யும்போது appliance-ஐ தெளிவாக குறிப்பிடவும்.`
    },

    washingmachine:{
        en:`🧺 Old washing machines are large appliances. Mention the item and quantity during booking so the pickup team can prepare.`,
        ta:`🧺 பழைய washing machine ஒரு பெரிய appliance. Booking செய்யும்போது item மற்றும் quantity-ஐ குறிப்பிடவும்.`
    },

    ac:{
        en:`❄️ Old AC units may be considered scrap/electronic material depending on the item and collection arrangement.<br><br>
        Mention the AC type during booking.`,
        ta:`❄️ பழைய AC unit scrap/electronic material ஆக இருக்கலாம். Collection arrangement பொருளைப் பொறுத்தது.<br><br>
        Booking-ல் AC type-ஐ குறிப்பிடவும்.`
    },

    vehicle:{
        en:`🚗 Vehicle scrap enquiries can include old vehicle parts and metal components.<br><br>
        For complete vehicle or large automobile scrap, contact our team before booking.`,
        ta:`🚗 Vehicle scrap enquiry-ல் பழைய vehicle parts மற்றும் metal components அடங்கலாம்.<br><br>
        Complete vehicle அல்லது பெரிய automobile scrap என்றால் booking-க்கு முன் எங்கள் team-ஐ தொடர்பு கொள்ளவும்.`
    },

    tyre:{
        en:`🛞 Used tyres are a special recyclable material. Mention the tyre type and quantity when requesting collection.`,
        ta:`🛞 Used tyres ஒரு தனிப்பட்ட recyclable material. Pickup request செய்யும்போது tyre type மற்றும் quantity-ஐ குறிப்பிடவும்.`
    },

    rates:{
        en:`💰 <strong>Scrap rates can change.</strong><br><br>
        Please check the current rates shown on the website before booking.<br><br>
        We do not want to give you an outdated or incorrect price.`,
        ta:`💰 <strong>Scrap rates மாறக்கூடியவை.</strong><br><br>
        Booking செய்வதற்கு முன் website-ல் காட்டப்படும் current rates-ஐ பார்க்கவும்.<br><br>
        பழைய அல்லது தவறான விலையை நாங்கள் சொல்ல விரும்பவில்லை.`
    },

    price:{
        en:`💰 The final amount generally depends on the applicable rate and actual measured weight.<br><br>
        <strong>Amount = Applicable Rate × Actual Weight</strong><br><br>
        Material type and condition can also affect the applicable rate.`,
        ta:`💰 இறுதி தொகை பொதுவாக applicable rate மற்றும் actual weight-ஐ பொறுத்தது.<br><br>
        <strong>தொகை = விலை × உண்மையான எடை</strong><br><br>
        Material type மற்றும் condition-மும் விலையை பாதிக்கலாம்.`
    },

    booking:{
        en:`🚚 <strong>How to book a pickup:</strong><br><br>
        1️⃣ Open the scrap selling/customer page<br>
        2️⃣ Select your scrap materials<br>
        3️⃣ Add the required details<br>
        4️⃣ Enter pickup information<br>
        5️⃣ Confirm your request<br><br>
        Your project may show a Booking ID after successful booking.`,
        ta:`🚚 <strong>Pickup booking செய்வது:</strong><br><br>
        1️⃣ Scrap selling/customer page திறக்கவும்<br>
        2️⃣ Scrap materials தேர்வு செய்யவும்<br>
        3️⃣ தேவையான details சேர்க்கவும்<br>
        4️⃣ Pickup information கொடுக்கவும்<br>
        5️⃣ Request confirm செய்யவும்<br><br>
        Booking முடிந்ததும் Booking ID கிடைக்கலாம்.`
    },

    doorstep:{
        en:`🚚 <strong>Doorstep pickup</strong> is one of our main services.<br><br>
        Enter an accurate address and useful landmark details while booking so the pickup team can find your location.`,
        ta:`🚚 <strong>Doorstep pickup</strong> எங்கள் முக்கிய சேவைகளில் ஒன்று.<br><br>
        Booking செய்யும்போது சரியான address மற்றும் landmark details கொடுக்கவும்.`
    },

    location:{
        en:`📍 During booking, provide your complete pickup address and a nearby landmark if possible.<br><br>
        If your website supports GPS, you can use it after granting location permission.`,
        ta:`📍 Booking செய்யும்போது முழுமையான pickup address மற்றும் அருகிலுள்ள landmark கொடுக்கவும்.<br><br>
        Website GPS support செய்தால் location permission கொடுத்து பயன்படுத்தலாம்.`
    },

    tracking:{
        en:`📍 <strong>Pickup tracking:</strong><br><br>
        Use the existing <strong>Track</strong> page in your website with your Booking ID or the tracking information provided by the system.<br><br>
        Do not share sensitive information publicly.`,
        ta:`📍 <strong>Pickup tracking:</strong><br><br>
        Website-ல் உள்ள <strong>Track</strong> page-ஐ Booking ID அல்லது system வழங்கும் tracking information மூலம் பயன்படுத்தலாம்.<br><br>
        Sensitive information-ஐ public-ஆக share செய்ய வேண்டாம்.`
    },

    gps:{
        en:`🗺️ If live GPS tracking is enabled for your pickup, the Track page can show the partner's latest available location and related information.<br><br>
        Live tracking depends on the tracking feature being active.`,
        ta:`🗺️ Pickup-க்கு live GPS tracking enabled இருந்தால் Track page-ல் partner-ன் latest available location மற்றும் தொடர்புடைய தகவல்கள் காட்டப்படலாம்.<br><br>
        Live tracking feature active ஆக இருப்பதை பொறுத்தது.`
    },

    status:{
        en:`📊 Pickup status tells you the current stage of your request.<br><br>
        Common stages may include:<br>
        • Pending/Processing<br>
        • Partner Assigned<br>
        • On The Way<br>
        • Completed<br><br>
        Your actual status should be checked from the Track page.`,
        ta:`📊 Pickup status உங்கள் request எந்த நிலையில் உள்ளது என்பதை காட்டுகிறது.<br><br>
        பொதுவான நிலைகள்:<br>
        • Pending/Processing<br>
        • Partner Assigned<br>
        • On The Way<br>
        • Completed<br><br>
        உங்கள் actual status-ஐ Track page-ல் பார்க்கவும்.`
    },

    payment:{
        en:`💳 Payment is normally handled after the scrap is checked, weighed and the final amount is confirmed.<br><br>
        Available payment methods can depend on the current collection arrangement.`,
        ta:`💳 Scrap check செய்து, எடை போட்டு, final amount confirm செய்த பிறகு payment செய்யப்படும்.<br><br>
        Payment method தற்போதைய collection arrangement-ஐ பொறுத்திருக்கலாம்.`
    },

    upi:{
        en:`📱 If UPI payment is available for your pickup, the collection team can confirm the available payment option at the time of payment.`,
        ta:`📱 உங்கள் pickup-க்கு UPI payment available இருந்தால் payment நேரத்தில் collection team உறுதி செய்யலாம்.`
    },

    cash:{
        en:`💵 Cash payment availability can depend on the current collection arrangement. Please confirm with the pickup team.`,
        ta:`💵 Cash payment availability தற்போதைய collection arrangement-ஐ பொறுத்திருக்கலாம். Pickup team-ிடம் confirm செய்யவும்.`
    },

    weighing:{
        en:`⚖️ The final amount should be based on the actual measured weight and applicable material rate.<br><br>
        You should verify the weight and amount before confirming the transaction.`,
        ta:`⚖️ Final amount actual measured weight மற்றும் applicable material rate-ஐ அடிப்படையாகக் கொண்டிருக்க வேண்டும்.<br><br>
        Transaction confirm செய்வதற்கு முன் weight மற்றும் amount-ஐ சரிபார்க்கவும்.`
    },

    minimum:{
        en:`⚖️ Minimum pickup quantity can depend on material, location and collection conditions.<br><br>
        If you have a very small quantity, contact us first:<br>
        📞 +91 95142 52104`,
        ta:`⚖️ Minimum pickup quantity material, location மற்றும் collection conditions-ஐ பொறுத்திருக்கலாம்.<br><br>
        Quantity மிகவும் குறைவாக இருந்தால் முதலில் தொடர்பு கொள்ளவும்:<br>
        📞 +91 95142 52104`
    },

    cancel:{
        en:`❌ Need to cancel a pickup?<br><br>
        Keep your Booking ID ready and contact support as soon as possible.<br><br>
        📞 <a href="tel:+919514252104">+91 95142 52104</a>`,
        ta:`❌ Pickup-ஐ cancel செய்ய வேண்டுமா?<br><br>
        Booking ID தயாராக வைத்துக்கொண்டு support-ஐ விரைவில் தொடர்பு கொள்ளவும்.<br><br>
        📞 <a href="tel:+919514252104">+91 95142 52104</a>`
    },

    reschedule:{
        en:`📅 To reschedule your pickup, contact support with your Booking ID as early as possible.<br><br>
        Changes depend on the current pickup status and schedule.`,
        ta:`📅 Pickup reschedule செய்ய Booking ID உடன் support-ஐ விரைவில் தொடர்பு கொள்ளவும்.<br><br>
        மாற்றம் pickup status மற்றும் schedule-ஐ பொறுத்தது.`
    },

    delay:{
        en:`⏰ If your pickup is delayed:<br><br>
        1️⃣ Check the Track page<br>
        2️⃣ Check your scheduled time<br>
        3️⃣ Keep your phone available<br>
        4️⃣ Contact support if needed<br><br>
        📞 +91 95142 52104`,
        ta:`⏰ Pickup தாமதமானால்:<br><br>
        1️⃣ Track page பார்க்கவும்<br>
        2️⃣ Scheduled time சரிபார்க்கவும்<br>
        3️⃣ Phone available-ஆக வைத்திருக்கவும்<br>
        4️⃣ தேவைப்பட்டால் support-ஐ தொடர்பு கொள்ளவும்<br><br>
        📞 +91 95142 52104`
    },

    partner:{
        en:`🚚 Your pickup partner may contact you before arrival depending on the pickup process.<br><br>
        Keep your registered phone available and check the Track page for updates.`,
        ta:`🚚 Pickup partner வருவதற்கு முன் உங்களை தொடர்பு கொள்ளலாம்.<br><br>
        Registered phone available-ஆக வைத்துக்கொண்டு Track page updates பார்க்கவும்.`
    },

    afterbooking:{
        en:`✅ <strong>After booking:</strong><br><br>
        • Booking request is recorded<br>
        • You may receive a Booking ID<br>
        • Pickup is processed according to the schedule<br>
        • Track the request from the Track page<br>
        • Pickup team handles weighing and collection`,
        ta:`✅ <strong>Booking செய்த பிறகு:</strong><br><br>
        • Booking request பதிவு செய்யப்படும்<br>
        • Booking ID கிடைக்கலாம்<br>
        • Schedule-க்கு ஏற்ப pickup process செய்யப்படும்<br>
        • Track page மூலம் பார்க்கலாம்<br>
        • Pickup team weighing மற்றும் collection செய்வார்கள்`
    },

    prepare:{
        en:`📦 <strong>Before pickup:</strong><br><br>
        • Separate materials if possible<br>
        • Keep paper/cardboard dry<br>
        • Keep scrap accessible<br>
        • Remove personal documents<br>
        • Remove personal data from electronics<br>
        • Keep enough space for weighing`,
        ta:`📦 <strong>Pickup-க்கு முன்:</strong><br><br>
        • முடிந்தால் materials பிரித்து வைக்கவும்<br>
        • Paper/cardboard-ஐ உலர்ந்த நிலையில் வைக்கவும்<br>
        • Scrap எளிதாக எடுக்கக்கூடிய இடத்தில் வைக்கவும்<br>
        • Personal documents அகற்றவும்<br>
        • Electronics-ல் personal data நீக்கவும்<br>
        • Weighing-க்கு போதுமான இடம் வைக்கவும்`
    },

    bulk:{
        en:`🏢 <strong>Bulk scrap enquiry</strong><br><br>
        For factory, office, shop, warehouse, apartment or large-volume scrap, contact our team with:<br><br>
        • Material type<br>
        • Approximate quantity<br>
        • Pickup location<br><br>
        📞 <a href="tel:+919514252104">+91 95142 52104</a>`,
        ta:`🏢 <strong>Bulk scrap enquiry</strong><br><br>
        Factory, office, shop, warehouse, apartment அல்லது பெரிய அளவு scrap இருந்தால்:<br><br>
        • Material type<br>
        • Approximate quantity<br>
        • Pickup location<br><br>
        📞 <a href="tel:+919514252104">+91 95142 52104</a>`
    },

        en:`💼 <strong>Business scrap collection</strong><br><br>

        📞 +91 95142 52104<br>
        📧 covaiscrabehub@gmail.com`,
        ta:`💼 <strong>Business scrap collection</strong><br><br>
        Regular அல்லது பெரிய அளவு scrap உள்ள businesses collection requirements பற்றி எங்களை தொடர்பு கொள்ளலாம்.<br><br>
        📞 +91 95142 52104<br>
        📧 covaiscrabehub@gmail.com`
    },

        en:`📞 <strong>COVAI SCRAP HUB Support</strong><br><br>
        Phone:<br>
        <a href="tel:+919514252104">+91 95142 52104</a><br><br>
        Email:<br>
        <a href="mailto:covaiscrabehub@gmail.com">covaiscrabehub@gmail.com</a>`,
        ta:`📞 <strong>COVAI SCRAP HUB Support</strong><br><br>
        Phone:<br>
        <a href="tel:+919514252104">+91 95142 52104</a><br><br>

/* ============================================================
   NORMALIZATION
============================================================ */

function normalize(text){

    return String(text || "")
        .toLowerCase()
        .normalize("NFC")
        .replace(/[?!.,;:()[\]{}'"`~@#$%^&*_+=<>/\\|-]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* ============================================================
   TOKENIZATION
============================================================ */

function tokens(text){

    return normalize(text)
        .split(" ")
        .filter(word => word.length > 1);
}


/* ============================================================
   SMART SEARCH
============================================================ */

function searchIntent(input){

    const query = normalize(input);

    if(!query) return null;

    const queryTokens = tokens(query);

    let best = null;
    let bestScore = 0;

    for(const intent of intents){

        for(const pattern of intent.patterns){

            const p = normalize(pattern);

            if(!p) continue;

            let score = 0;

            /* Exact */
            if(query === p){
                score += 100;
            }

            /* Full phrase */
            if(query.includes(p)){
                score += Math.min(70,p.length);
            }

            if(p.includes(query) && query.length > 4){
                score += 20;
            }

            const pTokens = tokens(p);

            /* Token comparison */
            for(const word of queryTokens){

                if(pTokens.includes(word)){
                    score += word.length >= 5 ? 9 : 5;
                }

                /* Partial spelling */
                for(const pWord of pTokens){

                    if(
                        word.length >= 4 &&
                        pWord.length >= 4 &&
                        (
                            pWord.includes(word) ||
                            word.includes(pWord)
                        )
                    ){
                        score += 3;
                    }
                }
            }

            /* Important phrase words */
            const importantWords = [
                "copper","iron","steel","aluminium","aluminum",
                "brass","paper","cardboard","plastic","battery",
                "laptop","computer","mobile","phone","tv","fridge",
                "refrigerator","washing","machine","ac","vehicle",
                "car","bike","tyre","tire","pickup","booking",
                "track","tracking","rate","price","payment","upi",
                "cash","bulk","factory","office","support","contact"
            ];

            for(const word of importantWords){

                if(query.includes(word) && p.includes(word)){
                    score += 12;
                }
            }

            if(score > bestScore){

                bestScore = score;

                best = {
                    name:intent.name,
                    score:score
                };
            }
        }
    }

    if(!best) return null;

    /* Minimum confidence */
    if(best.score < 8) return null;

    return best.name;
}


/* ============================================================
   LANGUAGE DETECTION
============================================================ */

function detectLanguage(text){

    const tamilChars = /[\u0B80-\u0BFF]/;

    if(tamilChars.test(text)){
        return "tamil";
    }

    const tanglishWords = [
        "epdi","enna","iruka","irukku","edupinga","vanguringa",
        "panradhu","panna","inga","anga","ungaloda","namma",
        "kudupingala","varinga","varuvanga","enga","bro","sir"
    ];

    const lower = text.toLowerCase();

    const count = tanglishWords.filter(word =>
        lower.includes(word)
    ).length;

    if(count >= 1){
        return "tamil";
    }

    return "english";
}

/* ============================================================
   SEND QUESTION
============================================================ */

function sendQuestion(){

    const input =
        document.getElementById("questionInput");

    const text =
        input.value.trim();

    if(!text) return;

    addUserMessage(text);

    input.value = "";

    input.style.height = "auto";

    updateSendButton();

    messageCount++;

    showTyping();

    const detected =
        detectLanguage(text);

    if(
        currentLang === "english" &&
        detected === "tamil"
    ){
        currentLang = "tamil";
        updateLanguageButton();
    }

    setTimeout(() => {

        removeTyping();

        const intent =
            searchIntent(text);

        console.log(
            "Question:",
            text,
            "Intent:",
            intent
        );

        const lang =
            currentLang === "tamil"
            ? "ta"
            : "en";

        if(intent && responses[intent]){

            addBotMessage(
                responses[intent][lang]
            );

        }else{

            addBotMessage(
                responses.default[lang]
            );
        }

    },500 + Math.min(text.length * 5,500));
}

/* ============================================================
   SECURITY
============================================================ */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

    const container =

    requestAnimationFrame(() => {

        container.scrollTop =
            container.scrollHeight;

    });
}
