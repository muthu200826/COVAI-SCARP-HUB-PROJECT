<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00a86b">
<meta name="description" content="Track your COVAI SCRAP HUB pickup live">

<title>Track Your Pickup - COVAI SCRAP HUB</title>

<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://tiles.openfreemap.org">
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#00a86b;
    --green2:#00c77d;
    --green-dark:#007d50;
    --green-light:#e9fff6;
    --green-soft:#f4fffa;

    --text:#15231d;
    --muted:#718078;
    --border:#e5ece9;

    --bg:#f4f8f6;
    --card:#ffffff;

    --blue:#3b82f6;
    --orange:#f59e0b;
    --red:#ef4444;

    --shadow:0 15px 45px rgba(15,23,42,.08);
    --shadow-sm:0 6px 20px rgba(15,23,42,.06);

    --radius:22px;
}

body.dark-mode{
    --green:#34d399;
    --green2:#10b981;
    --green-dark:#059669;

    --green-light:#102b21;
    --green-soft:#12251e;

    --text:#f3f7f5;
    --muted:#9ca9a3;
    --border:#293a33;

    --bg:#0c1511;
    --card:#142019;

    --shadow:0 15px 45px rgba(0,0,0,.30);
    --shadow-sm:0 6px 20px rgba(0,0,0,.25);
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    transition:.25s ease;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.hidden{
    display:none!important;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:16px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,168,107,.14),
            transparent 35%
        ),
        var(--bg);
}

.loading-logo{
    width:70px;
    height:70px;

    border-radius:21px;

    overflow:hidden;

    background:#fff;

    border:2px solid var(--green);

    box-shadow:
        0 12px 35px rgba(0,168,107,.18);
}

.loading-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.spinner{
    width:42px;
    height:42px;

    border-radius:50%;

    border:4px solid rgba(0,168,107,.15);
    border-top-color:var(--green);

    animation:spin .8s linear infinite;
}

.loading-text{
    font-size:13px;
    color:var(--muted);
    font-weight:700;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   COMMON BRAND
========================================================= */

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:44px;
    height:44px;

    border-radius:14px;

    overflow:hidden;

    background:#fff;

    border:1px solid var(--border);

    box-shadow:var(--shadow-sm);

    flex-shrink:0;
}

.brand-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand-name{
    color:var(--text);
    font-size:15px;
    font-weight:950;
    letter-spacing:.3px;
}

.brand-sub{
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
    font-weight:600;
}

/* =========================================================
   SEARCH PAGE
========================================================= */

.search-page{
    min-height:100vh;

    padding:24px 18px 55px;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(0,168,107,.15),
            transparent 28%
        ),
        radial-gradient(
            circle at 100% 25%,
            rgba(0,168,107,.08),
            transparent 25%
        ),
        var(--bg);
}

.search-header{
    width:100%;
    max-width:1120px;

    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.back-btn{
    height:40px;

    padding:0 15px;

    border:1px solid var(--border);
    border-radius:13px;

    background:var(--card);

    color:var(--text);

    font-size:11px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.back-btn:hover{
    transform:translateY(-1px);
    border-color:var(--green);
    color:var(--green);
}

/* =========================================================
   SEARCH GRID
========================================================= */

.search-container{
    width:100%;
    max-width:1120px;

    margin:auto;

    display:grid;

    grid-template-columns:
        minmax(350px,440px)
        minmax(0,1fr);

    gap:20px;
}

/* =========================================================
   SEARCH CARD
========================================================= */

.pickup-form{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:28px;

    padding:30px;

    box-shadow:var(--shadow);

    animation:cardIn .45s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.form-logo{
    width:75px;
    height:75px;

    margin:0 auto 18px;

    border-radius:23px;

    overflow:hidden;

    border:2px solid rgba(0,168,107,.25);

    background:#fff;

    box-shadow:
        0 12px 30px rgba(0,168,107,.16);
}

.form-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.pickup-form h1{
    text-align:center;

    font-size:27px;

    font-weight:950;

    color:var(--text);
}

.form-description{
    max-width:340px;

    margin:10px auto 25px;

    text-align:center;

    color:var(--muted);

    font-size:12px;

    line-height:1.65;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-box{
    display:none;

    margin-bottom:14px;

    padding:12px 14px;

    border-radius:13px;

    font-size:11px;

    line-height:1.5;
}

.message-box.show{
    display:block;
}

.message-error{
    background:#fff1f2;
    border:1px solid #fecdd3;
    color:#9f1239;
}

.message-info{
    background:var(--green-light);
    border:1px solid rgba(0,168,107,.2);
    color:var(--green-dark);
}

body.dark-mode .message-error{
    background:#35151c;
    border-color:#68212e;
    color:#fda4af;
}

/* =========================================================
   INPUT
========================================================= */

.input-label{
    display:block;

    margin-bottom:8px;

    color:var(--text);

    font-size:10px;
    font-weight:900;

    letter-spacing:.5px;
}

.phone-wrapper{
    position:relative;
    margin-bottom:12px;
}

.phone-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    font-size:17px;

    z-index:2;
}

.phone-input{
    width:100%;
    height:54px;

    padding:0 15px 0 44px;

    border:1.5px solid var(--border);

    border-radius:15px;

    outline:none;

    background:var(--bg);

    color:var(--text);

    font-size:15px;
    font-weight:650;

    transition:.2s;
}

.phone-input:focus{
    border-color:var(--green);

    background:var(--card);

    box-shadow:
        0 0 0 4px rgba(0,168,107,.09);
}

.phone-input::placeholder{
    color:#9aa59f;
    font-weight:450;
}

/* =========================================================
   BUTTONS
========================================================= */

.main-btn{
    width:100%;
    height:54px;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            var(--green2),
            var(--green-dark)
        );

    color:#fff;

    font-size:13px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 25px rgba(0,168,107,.20);

    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 30px rgba(0,168,107,.27);
}

.main-btn:active{
    transform:scale(.98);
}

.loading-btn{
    opacity:.65;
    pointer-events:none;
}

.or-divider{
    display:flex;
    align-items:center;

    margin:17px 0;
}

.or-divider::before,
.or-divider::after{
    content:"";

    flex:1;

    height:1px;

    background:var(--border);
}

.or-divider span{
    padding:0 11px;

    color:var(--muted);

    font-size:10px;
    font-weight:800;
}

.secondary-btn{
    width:100%;
    height:50px;

    border:1.5px solid var(--green);

    border-radius:15px;

    background:transparent;

    color:var(--green);

    font-size:13px;
    font-weight:850;

    cursor:pointer;

    transition:.2s;
}

.secondary-btn:hover{
    background:var(--green-light);
    transform:translateY(-1px);
}

/* =========================================================
   NOTE
========================================================= */

.phone-note{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:12px;

    color:var(--muted);

    font-size:9px;

    line-height:1.5;
}

.phone-note-icon{
    width:20px;
    height:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--green-light);
    color:var(--green);

    flex-shrink:0;
}

/* =========================================================
   HOW IT WORKS
========================================================= */

.how-title{
    margin-top:27px;
    padding-top:22px;

    border-top:1px solid var(--border);

    color:var(--text);

    font-size:12px;
    font-weight:900;
}

.steps{
    display:flex;
    flex-direction:column;

    gap:13px;

    margin-top:15px;
}

.step{
    display:flex;
    align-items:flex-start;

    gap:11px;
}

.step-icon{
    width:35px;
    height:35px;

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--green-light);

    color:var(--green);

    flex-shrink:0;
}

.step-title{
    color:var(--text);

    font-size:11px;
    font-weight:850;
}

.step-text{
    margin-top:3px;

    color:var(--muted);

    font-size:9px;

    line-height:1.45;
}

/* =========================================================
   RIGHT HERO
========================================================= */

.info-card{
    position:relative;

    overflow:hidden;

    min-height:600px;

    padding:34px;

    border-radius:28px;

    border:1px solid rgba(0,168,107,.15);

    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--green-soft)
        );

    box-shadow:var(--shadow);
}

.info-card::before{
    content:"";

    position:absolute;

    width:330px;
    height:330px;

    right:-130px;
    top:-150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,168,107,.18),
            transparent 68%
        );
}

.info-card::after{
    content:"♻";

    position:absolute;

    right:35px;
    bottom:10px;

    font-size:170px;

    color:rgba(0,168,107,.045);
}

.info-content{
    position:relative;
    z-index:2;
}

.info-small{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 11px;

    border-radius:30px;

    background:var(--green-light);

    color:var(--green-dark);

    font-size:9px;
    font-weight:900;

    letter-spacing:.5px;
}

.live-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    animation:livePulse 1.5s infinite;
}

@keyframes livePulse{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:.5;
    }
}

.info-card h2{
    max-width:600px;

    margin-top:18px;

    color:var(--text);

    font-size:38px;

    line-height:1.1;

    font-weight:950;

    letter-spacing:-1px;
}

.info-card-description{
    max-width:570px;

    margin-top:12px;

    color:var(--muted);

    font-size:14px;

    line-height:1.7;
}

/* =========================================================
   JOURNEY PREVIEW
========================================================= */

.tracking-preview{
    max-width:650px;

    margin-top:28px;

    padding:20px;

    border-radius:20px;

    background:rgba(255,255,255,.76);

    border:1px solid var(--border);

    box-shadow:var(--shadow-sm);

    backdrop-filter:blur(12px);
}

body.dark-mode .tracking-preview{
    background:rgba(20,32,25,.85);
}

.preview-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.preview-title{
    color:var(--text);

    font-size:13px;
    font-weight:900;
}

.preview-live{
    color:var(--green);

    font-size:9px;
    font-weight:900;
}

.preview-line{
    padding-left:43px;

    position:relative;
}

.preview-item{
    position:relative;

    min-height:65px;
}

.preview-item:not(:last-child)::before{
    content:"";

    position:absolute;

    left:-27px;
    top:30px;

    width:2px;
    height:52px;

    background:#dce7e2;
}

body.dark-mode .preview-item:not(:last-child)::before{
    background:#33453c;
}

.preview-dot{
    position:absolute;

    left:-43px;
    top:0;

    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--green-light);

    border:2px solid rgba(0,168,107,.18);

    color:var(--green);

    font-size:13px;
}

.preview-item.active .preview-dot{
    background:var(--green);
    border-color:var(--green);

    color:#fff;

    box-shadow:
        0 0 0 5px rgba(0,168,107,.10);
}

.preview-text{
    color:var(--text);

    font-size:11px;
    font-weight:850;
}

.preview-sub{
    margin-top:4px;

    color:var(--muted);

    font-size:9px;
}

/* =========================================================
   BENEFITS
========================================================= */

.benefits{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    max-width:650px;

    gap:10px;

    margin-top:16px;
}

.benefit{
    padding:14px 10px;

    text-align:center;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;
}

.benefit-icon{
    font-size:19px;
}

.benefit-title{
    margin-top:5px;

    color:var(--text);

    font-size:9px;
    font-weight:900;
}

.benefit-text{
    margin-top:2px;

    color:var(--muted);

    font-size:8px;
}

/* =========================================================
   TRACKING PAGE
========================================================= */

.tracking-page{
    min-height:100vh;

    background:var(--bg);
}

.top-header{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    background:var(--card);

    border-bottom:1px solid var(--border);

    position:relative;

    z-index:5000;
}

.header-actions{
    display:flex;
    align-items:center;

    gap:8px;
}

.header-btn{
    height:40px;

    padding:0 15px;

    border:1px solid var(--border);

    border-radius:12px;

    background:var(--card);

    color:var(--text);

    font-size:10px;
    font-weight:850;

    cursor:pointer;

    transition:.2s;
}

.header-btn:hover{
    color:var(--green);
    border-color:var(--green);
}

/* =========================================================
   DESKTOP LAYOUT
========================================================= */

.desktop-layout{
    width:100%;
    max-width:1500px;

    margin:auto;

    padding:16px;

    display:grid;

    grid-template-columns:
        minmax(0,1.5fr)
        minmax(350px,.65fr);

    gap:16px;
}

/* =========================================================
   MAP
========================================================= */

.map-card{
    height:calc(100vh - 102px);

    min-height:560px;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#dfe9e5;

    box-shadow:var(--shadow);
}

#map{
    width:100%;
    height:100%;
    position:relative;
    z-index:1;
}

.map-top-overlay{
    position:absolute;

    left:14px;
    right:14px;
    top:14px;

    z-index:1000;

    pointer-events:none;
}

.live-status-card{
    max-width:570px;

    padding:10px;

    display:flex;
    align-items:center;

    gap:10px;

    border-radius:17px;

    background:rgba(255,255,255,.95);

    border:1px solid rgba(255,255,255,.85);

    box-shadow:
        0 10px 30px rgba(0,0,0,.13);

    backdrop-filter:blur(15px);

    pointer-events:auto;
}

body.dark-mode .live-status-card{
    background:rgba(20,32,25,.94);
    border-color:#33453c;
}

.partner-avatar{
    width:45px;
    height:45px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--green2),
            var(--green-dark)
        );

    color:#fff;

    font-size:20px;

    flex-shrink:0;
}

.status-info{
    flex:1;
    min-width:0;
}

.partner-name{
    color:#17221e;

    font-size:13px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

body.dark-mode .partner-name{
    color:#fff;
}

.partner-phone{
    color:#75827c;

    margin-top:2px;

    font-size:9px;
}

.status-badge{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:4px;

    color:var(--green-dark);

    font-size:9px;
    font-weight:850;
}

.pulse{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    animation:livePulse 1.5s infinite;
}

.eta-box{
    min-width:82px;

    padding:9px;

    text-align:center;

    border-radius:13px;

    background:var(--green-light);

    border:1px solid rgba(0,168,107,.18);
}

.eta-time{
    color:var(--green-dark);

    font-size:16px;
    font-weight:950;

    line-height:1.1;
}

.eta-label{
    margin-top:3px;

    color:var(--green);

    font-size:8px;
    font-weight:900;

    letter-spacing:.7px;
}

.locate-btn{
    position:absolute;

    right:14px;
    bottom:92px;

    z-index:1000;

    width:43px;
    height:43px;

    border:0;

    border-radius:13px;

    background:#fff;

    box-shadow:0 7px 20px rgba(0,0,0,.16);

    color:#374151;

    cursor:pointer;

    font-size:19px;
}

.locate-btn:hover{
    color:var(--green);
}

.distance-badge{
    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    z-index:1000;

    padding:9px 15px;

    border-radius:30px;

    background:#111827;

    color:#fff;

    font-size:10px;
    font-weight:850;

    box-shadow:0 9px 25px rgba(0,0,0,.22);

    white-space:nowrap;
}

.map-float-label{
    position:absolute;

    left:14px;
    bottom:15px;

    z-index:1000;

    padding:7px 10px;

    border-radius:9px;

    background:rgba(17,24,39,.88);

    color:#fff;

    font-size:8px;
    font-weight:850;
}

/* =========================================================
   SIDE PANEL
========================================================= */

.side-panel{
    min-width:0;

    display:flex;
    flex-direction:column;

    gap:12px;

    overflow-y:auto;

    max-height:calc(100vh - 102px);

    padding-right:2px;
}

.panel-card{
    padding:16px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:19px;

    box-shadow:var(--shadow-sm);
}

.panel-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.panel-title h2{
    color:var(--text);

    font-size:14px;
    font-weight:900;
}

.panel-title span{
    color:var(--muted);

    font-size:8px;
    font-weight:850;
}

.status-large{
    display:flex;
    align-items:center;

    gap:10px;

    padding:13px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--green-light),
            var(--green-soft)
        );

    border:1px solid rgba(0,168,107,.15);
}

.status-large-icon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

/* =========================================================
   ORDER COMPLETED ANIMATION
   Works on desktop + mobile/WebView
========================================================= */

.completed-overlay{
    position:fixed;
    inset:0;
    z-index:1000000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(3,10,7,.78);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    animation:completedFadeIn .35s ease both;
}

.completed-celebration{
    position:relative;
    width:min(430px,94vw);
    padding:34px 24px 28px;
    text-align:center;
    border-radius:28px;
    background:var(--card);
    border:1px solid rgba(0,168,107,.22);
    box-shadow:0 30px 90px rgba(0,0,0,.35);
    overflow:hidden;
    animation:completedPop .55s cubic-bezier(.2,.9,.2,1.15) both;
}

.completed-celebration::before{
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    left:50%;
    top:-145px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(0,168,107,.13);
}

.completed-check{
    position:relative;
    width:92px;
    height:92px;
    margin:0 auto 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,var(--green2),var(--green-dark));
    color:#fff;
    font-size:46px;
    box-shadow:0 14px 35px rgba(0,168,107,.28);
    animation:completedCheck .7s .15s cubic-bezier(.2,.9,.2,1.2) both;
}

.completed-check::after{
    content:"";
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:2px solid rgba(0,168,107,.22);
    animation:completedRing 1.5s .35s ease-out infinite;
}

.completed-title{
    position:relative;
    color:var(--text);
    font-size:25px;
    line-height:1.15;
    font-weight:950;
}

.completed-subtitle{
    position:relative;
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
}

.completed-order-id{
    position:relative;
    display:inline-flex;
    margin-top:15px;
    padding:7px 11px;
    border-radius:999px;
    background:var(--green-light);
    color:var(--green-dark);
    font-size:10px;
    font-weight:900;
}

.completed-close{
    position:relative;
    width:100%;
    height:46px;
    margin-top:20px;
    border:0;
    border-radius:13px;
    background:var(--green);
    color:#fff;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.completed-particle{
    position:absolute;
    width:7px;
    height:12px;
    border-radius:3px;
    background:var(--green);
    opacity:0;
    animation:completedParticle 1.7s ease-out forwards;
}

@keyframes completedFadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes completedPop{
    from{opacity:0;transform:translateY(20px) scale(.86)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes completedCheck{
    from{transform:scale(.2) rotate(-18deg);opacity:0}
    to{transform:scale(1) rotate(0);opacity:1}
}

@keyframes completedRing{
    0%{transform:scale(.82);opacity:.75}
    100%{transform:scale(1.35);opacity:0}
}

@keyframes completedParticle{
    0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.65)}
}

/* WebIntoApp/WebView: don't allow the map to collapse or hide */
#map{
    min-height:100%;
    isolation:isolate;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
}

.leaflet-container{

    height:100%;
    min-height:100%;

}

        animation:none!important;

/* =========================================================
   PHONE NORMALIZATION
========================================================= */

function normalizePhone(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    let digits =
        String(value)
        .replace(/\D/g,"");


    if(digits.startsWith("0091")){

        digits =
            digits.substring(4);
    }

    if(digits.startsWith("91") &&
       digits.length === 12){

        digits =
            digits.substring(2);
    }

    if(digits.startsWith("0") &&
       digits.length === 11){

        digits =
            digits.substring(1);
    }

    if(digits.length > 10){

        digits =
            digits.slice(-10);
    }

    return digits;
}


/* =========================================================
   PHONE MATCH
========================================================= */

function phonesMatch(phone1,phone2){

    const a =
        normalizePhone(phone1);

    const b =
        normalizePhone(phone2);

    if(!a || !b){

        return false;
    }

    return a === b;
}


/* =========================================================
   SEARCH BY PHONE
========================================================= */

async function searchByPhone(searchPhone){

    showSearching();

    try{

        const snap =
            await get(
                ref(db,"pickupRequests")
            );


        if(!snap.exists()){

            showInputForm(
                "No pickup requests are available yet."
            );

            return;
        }


        const data = snap.val();

        const normalizedSearch =
            normalizePhone(searchPhone);


        if(
            !normalizedSearch ||
            normalizedSearch.length < 10
        ){

            showInputForm(
                "Please enter a valid 10-digit mobile number."
            );

            return;
        }


        const matches =
            Object.entries(data)

            .filter(([id,p])=>{

                if(!p){

                    return false;
                }


                const possiblePhones = [

                    p.phone,

                    p.mobile,

                    p.customerPhone,

                    p.customerMobile,

                    p.phoneNumber,

                    p.customer?.phone,

                    p.customer?.mobile

                ];


                return possiblePhones.some(
                    phone =>
                        phonesMatch(
                            phone,
                            normalizedSearch
                        )
                );

            })

            .map(([id,p])=>({

                ...p,

                id

            }))

            .sort((a,b)=>{

                const aTime =
                    getTimestamp(
                        a.createdAt ||
                        a.submittedAt ||
                        a.timestamp ||
                        0
                    );

                const bTime =
                    getTimestamp(
                        b.createdAt ||
                        b.submittedAt ||
                        b.timestamp ||
                        0
                    );

                return bTime - aTime;

            });


        if(!matches.length){

            showInputForm(
                "No pickup found for this mobile number."
            );

            return;
        }


        if(matches.length === 1){

            pickupId =
                matches[0].id;

            loadPickup();

            return;
        }


        showPickupList(matches);


    }
    catch(error){

        console.error(
            "Tracking search error:",
            error
        );

        showInputForm(
            "Unable to search right now. Please check your internet connection."
        );

    }
}

/* =========================================================
   ESCAPE
========================================================= */

function esc(v){

    return String(v ?? "")
        .replace(
            /[&<>"']/g,
            m=>({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m])
        );
}


function escAttr(v){

    return String(v ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(value){

    if(!value){

        return 0;
    }


    if(typeof value === "number"){

        return value;
    }


    if(
        typeof value === "object" &&
        value.seconds
    ){

        return Number(value.seconds) * 1000;
    }


    const date =
        new Date(value);


    const time =
        date.getTime();


    return isNaN(time)
        ? 0
        : time;
}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    const time =
        getTimestamp(value);


    if(!time){

        return "Date unknown";
    }


    return new Date(time)
        .toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );
}


/* =========================================================
   CUSTOMER GPS
========================================================= */

function getCustomerGPS(r){

    const lat =

        r.latitude ??

        r.pickupLatitude ??

        r.customerLatitude ??

        (
            r.customerGPS &&
            r.customerGPS.latitude
        );


    const lng =

        r.longitude ??

        r.pickupLongitude ??

        r.customerLongitude ??

        (
            r.customerGPS &&
            r.customerGPS.longitude
        );


    if(
        lat != null &&
        lng != null
    ){

        const latitude =
            Number(lat);

        const longitude =
            Number(lng);


        if(
            Number.isFinite(latitude) &&
            Number.isFinite(longitude)
        ){

            return {

                lat:latitude,

                lng:longitude

            };
        }
    }


    return null;
}


/* =========================================================
   PARTNER GPS
========================================================= */

function getPartnerGPS(r){

    const gps =
        r.partnerGPS ||
        r.partnerLocation;


    if(
        gps &&
        gps.latitude != null &&
        gps.longitude != null
    ){

        const lat =
            Number(gps.latitude);

        const lng =
            Number(gps.longitude);


        if(
            Number.isFinite(lat) &&
            Number.isFinite(lng)
        ){

            return {

                lat,

                lng,

                enabled:
                    gps.enabled === true

            };
        }
    }


    return null;
}


/* =========================================================
   TRACKING STAGE
========================================================= */

function getTrackingStageIndex(){

    if(!pickup){

        return -1;
    }


    const t =
        pickup.tracking || {};


    const status =
        String(
            pickup.trackingStatus ||
            pickup.status ||
            ""
        ).toLowerCase();


    let index = 0;


    const keys = [

        "created",
        "processing",
        "assigned",
        "on_the_way",
        "arrived",
        "pickup_started",
        "completed"

    ];


    keys.forEach((key,i)=>{

        const node =
            t[key];


        if(
            node &&
            (
                node.completed === true ||
                node.time ||
                node.timestamp
            )
        ){

            index =
                Math.max(index,i);

        }

    });


    if(
        pickup.createdAt ||
        pickup.submittedAt ||
        pickup.timestamp
    ){

        index =
            Math.max(index,0);
    }


    if(
        pickup.processingAt ||
        status.includes("processing") ||
        status === "confirmed"
    ){

        index =
            Math.max(index,1);
    }


    if(
        pickup.partnerAssignedAt ||
        pickup.partnerName ||
        status.includes("assigned")
    ){

        index =
            Math.max(index,2);
    }


    if(
        pickup.goingToPickupAt ||
        pickup.onTheWayAt ||
        status.includes("way") ||
        status.includes("going")
    ){

        index =
            Math.max(index,3);
    }


    if(
        pickup.arrivedAt ||
        status.includes("arrived")
    ){

        index =
            Math.max(index,4);
    }


    if(
        pickup.pickupStartedAt ||
        status.includes("pickup started") ||
        status === "picked_up"
    ){

        index =
            Math.max(index,5);
    }


    if(
        pickup.completedAt ||
        status.includes("completed")
    ){

        index =
            Math.max(index,6);
    }


    const statusIndex = {

        pending:0,
        created:0,

        confirmed:1,
        processing:1,

        assigned:2,

        on_the_way:3,
        "on the way":3,

        arrived:4,

        pickup_started:5,
        "pickup started":5,
        picked_up:5,

        completed:6

    };


    if(
        statusIndex[status] !== undefined
    ){

        index =
            Math.max(
                index,
                statusIndex[status]
            );
    }


    return index;
}

/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;


    const dLat =
        (lat2-lat1) *
        Math.PI / 180;


    const dLng =
        (lng2-lng1) *
        Math.PI / 180;


    const a =

        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1*Math.PI/180
        ) *

        Math.cos(
            lat2*Math.PI/180
        ) *

        Math.sin(dLng/2) *
        Math.sin(dLng/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;
}


/* =========================================================
   DISTANCE FORMAT
========================================================= */

function formatDistance(km){

    if(km < 1){

        return Math.round(
            km*1000
        ) + " m away";
    }


    return km.toFixed(1) +
        " km away";
}


/* =========================================================
   ETA
========================================================= */

function calculateETA(distanceKm){
    const safeDistance = Number(distanceKm);

    if(!Number.isFinite(safeDistance) || safeDistance <= 0.08){
        return "Arriving";
    }

    const avgSpeed = 30;
    const minutes = Math.max(
        1,
        Math.ceil((safeDistance / avgSpeed) * 60)
    );

    if(minutes === 1){
        return "1 min";
    }

    if(minutes < 60){
        return minutes + " mins";
    }

    const hrs = Math.floor(minutes / 60);
    const mins = minutes % 60;

    return hrs + "h " + mins + "m";
}

/*
   ETA countdown:
   - starts only when partner starts travelling
   - uses allocatedMinutes saved by admin
   - never becomes negative
   - also exposes an actual expected arrival clock time
*/
function getTravelStartTime(){
    if(!pickup){
        return 0;
    }

    return getTimestamp(
        pickup.goingToPickupAt ||
        pickup.onTheWayAt ||
        pickup.tracking?.on_the_way?.time ||
        pickup.tracking?.on_the_way?.timestamp
    );
}

function getAllocatedMinutes(){
    if(!pickup){
        return 30;
    }

    const value = Number(
        pickup.allocatedMinutes ??
        pickup.etaMinutes ??
        pickup.estimatedMinutes ??
        30
    );

    return Number.isFinite(value) && value > 0
        ? Math.ceil(value)
        : 30;
}

function getCountdownMinutes(){
    const start = getTravelStartTime();

    if(!start){
        return null;
    }

    const totalMs =
        getAllocatedMinutes() * 60 * 1000;

    const remainingMs =
        (start + totalMs) - Date.now();

    return Math.max(
        0,
        Math.ceil(remainingMs / 60000)
    );
}

function formatRemainingETA(minutes){
    if(minutes === null){
        return null;
    }

    if(minutes <= 0){
        return "Arriving";
    }

    if(minutes === 1){
        return "1 min";
    }

    if(minutes < 60){
        return minutes + " mins";
    }

    const hrs = Math.floor(minutes / 60);
    const mins = minutes % 60;

    return mins
        ? hrs + "h " + mins + "m"
        : hrs + "h";
}

function getArrivalClock(){
    const start = getTravelStartTime();

    if(!start){
        return "";
    }

    const arrival =
        start +
        getAllocatedMinutes() * 60 * 1000;

    return new Date(arrival).toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    );
}

function updateETAUI(distanceKm){
    const etaTime =
        document.getElementById("etaTime");

    const etaLabel =
        document.querySelector(".eta-label");

    if(!etaTime){
        return;
    }

    const stage =
        getTrackingStageIndex();

    /*
       Before "On The Way": show the allocated estimate,
       but do not run a countdown.
    */
    if(stage < 3){
        etaTime.textContent =
            getAllocatedMinutes() + " min";

        if(etaLabel){
            etaLabel.textContent = "EST. ETA";
        }

        return;
    }

    const countdown =
        getCountdownMinutes();

    /*
       GPS ETA and admin ETA are both considered.
       The countdown is never allowed to increase.
    */
    let display = formatRemainingETA(countdown);

    if(
        Number.isFinite(Number(distanceKm)) &&
        Number(distanceKm) > 0.08
    ){
        const gpsText =
            calculateETA(distanceKm);

        if(
            countdown === null ||
            gpsText === "Arriving"
        ){
            display = gpsText;
        }
        else{
            const gpsMinutes =
                Math.max(
                    1,
                    Math.ceil(
                        (Number(distanceKm) / 30) * 60
                    )
                );

            const remaining =
                Math.min(
                    countdown,
                    gpsMinutes
                );

            display =
                formatRemainingETA(remaining);
        }
    }

    etaTime.textContent =
        display || "Arriving";

    if(etaLabel){
        const clock = getArrivalClock();

        etaLabel.textContent =
            clock
                ? "ARRIVES " + clock
                : "ARRIVING";
    }
}

function showOrderCompletedAnimation(){

    if(
        !pickup ||
        getCurrentStatus() !== "Completed"
    ){
        return;
    }

    const key =
        "covai_completed_animation_" +
        String(pickup.id);

    if(localStorage.getItem(key) === "shown"){
        return;
    }

    localStorage.setItem(key,"shown");

    if(document.querySelector(".completed-overlay")){
        return;
    }

    const overlay =
        document.createElement("div");

    overlay.className =
        "completed-overlay";

    const orderShort =
        String(pickup.id || "")
        .slice(-8);

    overlay.innerHTML = `
        <div class="completed-celebration">

            <div class="completed-check">
                ✓
            </div>

            <div class="completed-title">
                Pickup Completed! 🎉
            </div>

            <div class="completed-subtitle">
                Your scrap pickup has been completed successfully.
                Thank you for choosing COVAI SCRAP HUB.
            </div>

            <div class="completed-order-id">
                Order #${esc(orderShort)}
            </div>

            <button
                class="completed-close"
                type="button">
                Continue Tracking
            </button>

        </div>
    `;

    const celebration =
        overlay.querySelector(
            ".completed-celebration"
        );

    /*
       Lightweight CSS particles. No canvas and no external
       library, so it works reliably inside WebIntoApp WebView.
    */
    for(let i=0;i<22;i++){

        const particle =
            document.createElement("span");

        particle.className =
            "completed-particle";

        const angle =
            (Math.PI * 2 * i) / 22;

        const distance =
            110 + Math.random() * 180;

        particle.style.setProperty(
            "--dx",
            Math.cos(angle) * distance + "px"
        );

        particle.style.setProperty(
            "--dy",
            Math.sin(angle) * distance + "px"
        );

        particle.style.setProperty(
            "--rot",
            (-180 + Math.random() * 360) + "deg"
        );

        particle.style.left = "50%";
        particle.style.top = "31%";

        particle.style.animationDelay =
            (Math.random() * .25) + "s";

        celebration.appendChild(particle);
    }

    document.body.appendChild(overlay);

    const close =
        overlay.querySelector(
            ".completed-close"
        );

    const closeOverlay = ()=>{

        overlay.style.opacity = "0";

        setTimeout(()=>{
            overlay.remove();
        },220);
    };

    close.addEventListener(
        "click",
        closeOverlay
    );

    overlay.addEventListener(
        "click",
        event=>{
            if(event.target === overlay){
                closeOverlay();
            }
        }
    );
}

/* =========================================================
   TIMELINE
========================================================= */

function renderTimeline(){

    if(!pickup){

        return;
    }


    const t =
        pickup.tracking || {};


    const stages = [

        {
            key:"created",
            icon:"📝",
            label:"Pickup Created",
            legacy:
                pickup.createdAt ||
                pickup.submittedAt ||
                pickup.timestamp
        },

        {
            key:"processing",
            icon:"⚙️",
            label:"Processing",
            legacy:pickup.processingAt
        },

        {
            key:"assigned",
            icon:"👷",
            label:"Partner Assigned",
            legacy:pickup.partnerAssignedAt
        },

        {
            key:"on_the_way",
            icon:"🚚",
            label:"On The Way",
            legacy:
                pickup.goingToPickupAt ||
                pickup.onTheWayAt
        },

        {
            key:"arrived",
            icon:"📍",
            label:"Arrived",
            legacy:pickup.arrivedAt
        },

        {
            key:"pickup_started",
            icon:"♻️",
            label:"Pickup Started",
            legacy:pickup.pickupStartedAt
        },

        {
            key:"completed",
            icon:"✅",
            label:"Completed",
            legacy:pickup.completedAt
        }

    ];


    const currentIndex =
        getTrackingStageIndex();


    function getStageTime(stage,index){

        const node =
            t[stage.key];


        if(node){

            if(node.time)
                return node.time;

            if(node.timestamp)
                return node.timestamp;

        }


        if(stage.legacy){

            return stage.legacy;
        }


        if(index === 0){

            return (
                pickup.createdAt ||
                pickup.submittedAt ||
                pickup.timestamp ||
                null
            );
        }


        return null;
    }


    const html =
        stages.map(
            (stage,index)=>{

                const time =
                    getStageTime(
                        stage,
                        index
                    );


                const done =
                    index <= currentIndex;


                const current =
                    index === currentIndex;


                return `

                    <div class="
                        timeline-item
                        ${done ? "active" : ""}
                        ${current ? "current" : ""}
                    ">

                        <div class="timeline-marker">

                            <div class="timeline-dot">

                                ${
                                    done
                                    ?
                                    stage.icon
                                    :
                                    ""
                                }

                            </div>


                            ${
                                index <
                                stages.length-1
                                ?
                                `
                                <div class="
                                    timeline-line
                                    ${
                                        index <
                                        currentIndex
                                        ?
                                        "done"
                                        :
                                        ""
                                    }
                                "></div>
                                `
                                :
                                ""
                            }

                        </div>


                        <div class="timeline-content">

                            <div class="timeline-text">

                                ${stage.icon}

                                ${stage.label}

                            </div>


                            <div class="timeline-time">

                                ${
                                    time
                                    ?
                                    formatTime(time)
                                    :
                                    current
                                    ?
                                    "In progress"
                                    :
                                    "Waiting"
                                }

                            </div>

                        </div>

                    </div>
                `;

            }
        ).join("");


    const desktop =
        document.getElementById(
            "timelineContainer"
        );


    if(desktop){

        desktop.innerHTML =
            html;

    }


    const mobile =
        document.getElementById(
            "mobileTimelineContainer"
        );


    if(mobile){

        mobile.innerHTML =
            html;

    }
}


/* =========================================================
   TIME
========================================================= */

function formatTime(value){

    const time =
        getTimestamp(value);


    if(!time){

        return "Waiting";
    }


    return new Date(time)
        .toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );
}


/* =========================================================
   FIT MAP
========================================================= */

window.fitTracking =
function(){

    if(!map){

        return;
    }


    const points = [];


    if(customerMarker){

        points.push(
            customerMarker.getLatLng()
        );

    }


    if(partnerMarker){

        points.push(
            partnerMarker.getLatLng()
        );

    }


    if(points.length === 1){

        map.setView(
            points[0],
            15,
            {
                animate:true
            }
        );

    }
    else if(points.length > 1){

        const bounds =
            L.latLngBounds(points);


        map.fitBounds(
            bounds,
            {
                padding:[60,60],
                maxZoom:16,
                animate:true
            }
        );

    }
};


/* =========================================================
   LIVE DISTANCE REFRESH
========================================================= */

setInterval(
    ()=>{

        if(!pickup || !map){
            return;
        }

        const custGPS =
            getCustomerGPS(pickup);

        const partGPS =
            getPartnerGPS(pickup);

        if(
            custGPS &&
            partGPS &&
            partGPS.enabled
        ){

            const dist =
                calculateDistance(
                    custGPS.lat,
                    custGPS.lng,
                    partGPS.lat,
                    partGPS.lng
                );

            const distBadge =
                document.getElementById(
                    "distanceBadge"
                );

            if(distBadge){
                distBadge.textContent =
                    formatDistance(dist);
            }

            updateETAUI(dist);
        }
        else{

            /*
               Keep the arrival countdown moving even
               when partner GPS is temporarily unavailable.
            */
            updateETAUI(null);
        }

    },
    1000
);


/* =========================================================
   CALL PARTNER
   FIXED
========================================================= */

window.callPartner =
function(){

    let phone = "";


    /*
       Get phone from current Firebase pickup first.
       This is safer than depending only on the button.
    */

    if(pickup){

        phone =
            pickup.partnerPhone ||
            pickup.partner?.phone ||
            pickup.partnerMobile ||
            "";

    }


    /*
       Fallback to button data attribute.
    */

    if(!phone){

        const mobileBtn =
            document.getElementById(
                "partnerCallBtn"
            );


        if(mobileBtn){

            phone =
                mobileBtn.getAttribute(
                    "data-phone"
                ) || "";

        }

    }


    if(!phone){

        const desktopBtn =
            document.getElementById(
                "partnerCallBtnDesktop"
            );


        if(desktopBtn){

            phone =
                desktopBtn.getAttribute(
                    "data-phone"
                ) || "";

        }

    }


    if(!phone){

        alert(
            "Partner phone number is not available."
        );

        return;
    }


    /*
       Clean the phone number.

       Example:
       +91 98765 43210

       becomes:
       +919876543210
    */

    let cleanPhone =
        String(phone)
        .trim()
        .replace(/[^\d+]/g,"");


    /*
       If the Firebase number is an Indian
       10-digit number, automatically add +91.
    */

    const digits =
        cleanPhone.replace(/\D/g,"");


    if(
        digits.length === 10 &&
        !cleanPhone.startsWith("+")
    ){

        cleanPhone =
            "+91" + digits;

    }


    /*
       Open phone dialer.

       Mobile:
       directly opens phone app.

       Desktop:
       browser/OS handles tel: links.
    */

    window.location.href =
        "tel:" + cleanPhone;

};
